name: eval-embedding-router
on:
  push:
    branches: [ai-embedding-router]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npx tsx scripts/eval-embed.mts
      - name: Push results
        run: |
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git checkout -b data/embed-eval
          git add -f research/embed_eval.json
          git commit -m "embed eval $(date -u +%FT%TZ)"
          git push -f origin data/embed-eval
