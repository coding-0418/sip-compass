name: research-scrape
on:
  push:
    branches: [data/review-scrape]
    paths: [research/scrape.py, research/label.py, .github/workflows/scrape.yml]
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install google-play-scraper==1.2.7 requests
      - run: python research/scrape.py
      - run: python research/label.py
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: research-data
          path: |
            research/*.csv
            research/*.json
